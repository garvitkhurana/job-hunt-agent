[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunt-agent"
version = "0.1.0"
description = "Discover, tailor, apply, and follow up for senior/founding PM roles"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.1",
  "openai>=1.40.0",
  "jinja2>=3.1.4",
  "tenacity>=8.5.0",
  "python-dateutil>=2.9.0",
]

[project.scripts]
hunt = "job_hunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
